<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header p-3 text-white">
            <h5>Task Manager</h5>
        </div>
        <ul class="sidebar-nav">
            <li><a href="#" id="nav-kanban" class="active"><i class="bi bi-kanban me-2"></i> Bảng điều khiển</a></li>
            <li><a href="#" id="nav-plan"><i class="bi bi-calendar-event me-2"></i> Kế hoạch</a></li>
            <li><a href="#" id="nav-stats"><i class="bi bi-graph-up me-2"></i> Thống kê</a></li>
            <li><a href="#" id="nav-pomodoro"><i class="bi bi-clock me-2"></i> Pomodoro</a></li>
        </ul>
    </aside>

    <main class="main-content">

        <div id="kanban-section" class="container mt-4">
            <h1 class="text-center mb-4 text-white">Trello Task Manager</h1>

            <div class="card p-4 mb-4">
                <div class="row">
                    <div class="col-md-5"><input type="text" id="taskTitle" class="form-control" placeholder="Tên công việc..."></div>
                    <div class="col-md-5"><input type="text" id="taskDesc" class="form-control" placeholder="Mô tả..."></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addTask()">Thêm</button></div>
                </div>
            </div>



            <div class="row">
                <div class="col-md-4 mb-4 list-group-container">
                    <div class="column-header d-flex justify-content-between align-items-center mb-2">
                        <h4 class="mb-0">TODO</h4>
                        <button class="btn btn-link btn-sm text-decoration-none clear-btn" data-status="TODO"><i class="bi bi-x-circle"></i></button>
                    </div>
                    <div id="todo-list" class="list-group"></div>
                </div>
                <div class="col-md-4 mb-4 list-group-container">
                    <div class="column-header d-flex justify-content-between align-items-center mb-2">
                        <h4 class="mb-0">DOING</h4>
                        <button class="btn btn-link btn-sm text-decoration-none clear-btn" data-status="DOING"><i class="bi bi-x-circle"></i></button>
                    </div>
                    <div id="doing-list" class="list-group"></div>
                </div>
                <div class="col-md-4 mb-4 list-group-container">
                    <div class="column-header d-flex justify-content-between align-items-center mb-2">
                        <h4 class="mb-0">DONE</h4>
                        <button class="btn btn-link btn-sm text-decoration-none clear-btn" data-status="DONE"><i class="bi bi-x-circle"></i></button>
                    </div>
                    <div id="done-list" class="list-group"></div>
                </div>
            </div>
        </div>

        <div id="pomodoro-section" class="main-content-section" style="display: none;">
            <video autoplay muted loop id="pomodoro-video">
                <source src="video/bg-video.mp4" type="video/mp4">
            </video>

            <div class="glass-card text-center p-5 mx-auto" style="position: relative; z-index: 2;">
                <h2 class="text-white mb-4">Phiên tập trung</h2>
                <div id="timer" class="display-1 fw-bold my-4 text-white">45:00</div>
                <div class="btn-group">
                    <button id="start-btn" class="btn btn-success px-4">Bắt đầu</button>
                    <button id="reset-btn" class="btn btn-outline-light px-4">Đặt lại</button>
                </div>
            </div>
        </div>

    </main>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Sửa công việc</h5></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <input type="text" id="editTitle" class="form-control mb-2">
                <textarea id="editDesc" class="form-control"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveEdit()">Lưu thay đổi</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/pomodoro.js"></script>
</body>
</html>
