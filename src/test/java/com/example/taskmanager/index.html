<!DOCTYPE html>
<html>

<head>
    <title>Trello Clone - Task List</title>
</head>

<body>
    <h1>Danh sách công việc của tôi</h1>
    <ul id="task-list"></ul>

    <script>
        // Gọi API từ Backend Spring Boot
        fetch('http://localhost:8080/api/tasks')
            .then(response => response.json()) // Chuyển dữ liệu sang JSON
            .then(data => {
                const list = document.getElementById('task-list');
                // Lặp qua danh sách task và thêm vào trang web
                data.forEach(task => {
                    const li = document.createElement('li');
                    li.textContent = task.title + ": " + task.description;
                    list.appendChild(li);
                });
            })
            .catch(error => console.error('Lỗi kết nối:', error));
    </script>
</body>

</html>
