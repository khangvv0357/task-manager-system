<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trello Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Trello Task Manager</h1>

    <div class="card p-4 mb-4">
        <div class="row">
            <div class="col-md-5">
                <input type="text" id="taskTitle" class="form-control" placeholder="Tên công việc...">
            </div>
            <div class="col-md-5">
                <input type="text" id="taskDesc" class="form-control" placeholder="Mô tả...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="addTask()">Thêm</button>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-4 mb-4 list-group-container">
            <div class="column-header d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">TODO</h4>
                <button class="btn btn-link btn-sm text-decoration-none clear-btn"
                        data-status="TODO" title="Xóa tất cả">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
            <div id="todo-list" class="list-group" style="min-height: 300px; border: 1px solid #ddd; padding: 10px;"></div>
        </div>

        <div class="col-md-4 mb-4 list-group-container">
            <div class="column-header d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">DOING</h4>
                <button class="btn btn-link btn-sm text-decoration-none clear-btn"
                        data-status="DOING" title="Xóa tất cả">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
            <div id="doing-list" class="list-group" style="min-height: 300px; border: 1px solid #ddd; padding: 10px;"></div>
        </div>

        <div class="col-md-4 mb-4 list-group-container">
            <div class="column-header d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">DONE</h4>
                <button class="btn btn-link btn-sm text-decoration-none clear-btn"
                        data-status="DONE" title="Xóa tất cả">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
            <div id="done-list" class="list-group" style="min-height: 300px; border: 1px solid #ddd; padding: 10px;"></div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Sửa công việc</h5></div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <input type="text" id="editTitle" class="form-control mb-2">
                    <textarea id="editDesc" class="form-control"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="saveEdit()">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
